version: '3.8'

services:
  # 1. PostgreSQL 16 Enterprise Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: hubio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hubio_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubio_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hubio_enterprise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubio_admin} -d ${POSTGRES_DB:-hubio_enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 High-Performance In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: hubio_redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 3. Hubio Enterprise REST API Backend Server
  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: hubio_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hubio_admin}:${POSTGRES_PASSWORD:-hubio_secret_2026}@postgres:5432/${POSTGRES_DB:-hubio_enterprise}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-hubio_jwt_enterprise_key_2026_super_secure}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Hubio Progressive Web & Admin App Runner
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    container_name: hubio_web
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - backend

  # 5. Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: hubio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  redis_data:
